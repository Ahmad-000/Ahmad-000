<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="460" viewBox="0 0 1000 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1b"/>
      <stop offset="1" stop-color="#17102e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#67e8f9" stroke-opacity=".08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="portrait">
      <rect x="655" y="58" width="280" height="340" rx="20"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="984" height="444" rx="26" fill="url(#bg)" stroke="url(#neon)" stroke-width="2"/>
  <rect x="9" y="9" width="982" height="442" rx="25" fill="url(#grid)"/>

  <circle cx="850" cy="150" r="140" fill="#7c3aed" opacity=".12">
    <animate attributeName="r" values="115;155;115" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="330" r="120" fill="#06b6d4" opacity=".12">
    <animate attributeName="r" values="100;135;100" dur="6s" repeatCount="indefinite"/>
  </circle>

  <rect x="42" y="44" width="205" height="30" rx="15" fill="#062b35" stroke="#22d3ee" stroke-opacity=".7"/>
  <circle cx="59" cy="59" r="4" fill="#34d399">
    <animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="72" y="63" fill="#a5f3fc" font-family="monospace" font-size="11">OPEN TO OPPORTUNITIES</text>

  <text x="42" y="126" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="21">Hi there, I'm</text>
  <text x="40" y="179" fill="url(#neon)" font-family="Arial,sans-serif" font-size="42" font-weight="bold">Ahmad Raza</text>

  <rect x="43" y="193" width="235" height="2" rx="1" fill="url(#neon)" filter="url(#glow)">
    <animate attributeName="width" values="35;235;35" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="42" y="232" fill="#67e8f9" font-family="monospace" font-size="17" font-weight="bold">Aspiring DevOps Engineer</text>
  <text x="42" y="266" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14">Building reliable deployments through</text>
  <text x="42" y="288" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14">containers, cloud, and CI/CD automation.</text>

  <g font-family="monospace" font-size="11" font-weight="bold">
    <rect x="42" y="319" width="76" height="29" rx="8" fill="#082b37" stroke="#22d3ee" stroke-opacity=".7"/>
    <text x="80" y="337" fill="#a5f3fc" text-anchor="middle">DOCKER</text>
    <rect x="128" y="319" width="58" height="29" rx="8" fill="#251942" stroke="#a78bfa" stroke-opacity=".8"/>
    <text x="157" y="337" fill="#ddd6fe" text-anchor="middle">AWS</text>
    <rect x="196" y="319" width="70" height="29" rx="8" fill="#082b37" stroke="#22d3ee" stroke-opacity=".7"/>
    <text x="231" y="337" fill="#a5f3fc" text-anchor="middle">LINUX</text>
    <rect x="276" y="319" width="145" height="29" rx="8" fill="#251942" stroke="#a78bfa" stroke-opacity=".8"/>
    <text x="348" y="337" fill="#ddd6fe" text-anchor="middle">GITHUB ACTIONS</text>
  </g>

  <path d="M42 377H590" stroke="#64748b" stroke-opacity=".4"/>
  <text x="42" y="402" fill="#94a3b8" font-family="monospace" font-size="11">CLOUD • CONTAINERS • AUTOMATION</text>

  <rect x="635" y="43" width="320" height="365" rx="25" fill="#0a1022" stroke="url(#neon)" stroke-width="2"/>
  <path d="M657 62H675M657 62V80M933 62H915M933 62V80M657 389H675M657 389V371M933 389H915M933 389V371" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>

  <image x="655" y="58" width="280" height="340" preserveAspectRatio="xMidYMid meet" clip-path="url(#portrait)" xlink:href="https://raw.githubusercontent.com/Ahmad-000/Ahmad-000/main/devops-character.png.png"/>

  <rect x="635" y="43" width="320" height="365" rx="25" fill="none" stroke="#22d3ee" stroke-opacity=".5">
    <animate attributeName="stroke-opacity" values=".2;.9;.2" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="800" y="433" fill="#94a3b8" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="2">AHMAD-000 / DEVOPS</text>
</svg>
