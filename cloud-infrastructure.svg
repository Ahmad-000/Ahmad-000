<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b1b"/>
      <stop offset="55%" stop-color="#10122b"/>
      <stop offset="100%" stop-color="#080b19"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172b46" stop-opacity=".94"/>
      <stop offset="100%" stop-color="#15112e" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00eaff"/>
      <stop offset="50%" stop-color="#7285ff"/>
      <stop offset="100%" stop-color="#d45bff"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#087eae"/>
      <stop offset="100%" stop-color="#542b91"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5c7ca8" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .heading {font:700 25px Arial,sans-serif;fill:#f3f7ff;letter-spacing:1.4px}
      .eyebrow {font:11px Arial,sans-serif;fill:#77eaff;letter-spacing:3px}
      .chiptext {font:700 17px Arial,sans-serif;fill:#f5f7ff;letter-spacing:.4px}
      .small {font:11px Arial,sans-serif;fill:#91a7c9;letter-spacing:1.4px}
      .chip {fill:url(#glass);stroke:#4a6d9c;stroke-opacity:.8;stroke-width:1.2}
      .edge {fill:none;stroke:url(#cyanPurple);stroke-width:1.8}
      .float1 {animation:float 4s ease-in-out infinite}
      .float2 {animation:float 4.8s ease-in-out infinite 0.5s}
      .float3 {animation:float 5.2s ease-in-out infinite 1s}
      .pulse {animation:pulse 3s ease-in-out infinite}
      @keyframes float {0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes pulse {0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes scan {0%{transform:translateY(-120px)}100%{transform:translateY(1100px)}}
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1080" rx="24" fill="url(#bg)"/>
  <rect width="1000" height="1080" rx="24" fill="url(#grid)"/>
  <circle cx="100" cy="170" r="170" fill="#00d9ff" opacity=".06"/>
  <circle cx="910" cy="830" r="230" fill="#a855f7" opacity=".07"/>
  <path d="M0 270H1000 M0 520H1000 M0 770H1000" stroke="#637ba5" stroke-opacity=".1"/>

  <!-- Header -->
  <text x="48" y="42" class="eyebrow">AHMAD RAZA / TECH STACK</text>
  <text x="48" y="72" font-family="Arial,sans-serif" font-size="13" fill="#91a7c9">CLOUD • AUTOMATION • DEVELOPMENT</text>
  <circle cx="928" cy="49" r="5" fill="#00f5c8" filter="url(#glow)"/>
  <text x="945" y="53" text-anchor="end" class="small">SYSTEM ONLINE</text>

  <!-- Section 1: Cloud -->
  <g>
    <path d="M42 104 L958 104 L974 120 L974 263 L958 279 L42 279 L26 263 L26 120 Z"
          fill="#030716" opacity=".75" transform="translate(0 9)"/>
    <path d="M42 104 L958 104 L974 120 L974 263 L958 279 L42 279 L26 263 L26 120 Z"
          fill="url(#glass)" stroke="url(#cyanPurple)" stroke-width="1.7"/>
    <path d="M42 279 L958 279 L974 263 L974 276 L958 293 L42 293 L26 277 L26 263 Z"
          fill="url(#side)" opacity=".8"/>
    <path d="M958 104 L974 120 L974 263 L958 279 L958 104Z" fill="#6d42b9" opacity=".35"/>
    <text x="52" y="135" class="eyebrow">01 / CLOUD LAYER</text>
    <text x="52" y="168" class="heading">Cloud &amp; Infrastructure</text>
    <text x="52" y="190" class="small">INFRASTRUCTURE AS CODE • CLOUD COMPUTING</text>

    <g class="float1">
      <rect x="52" y="211" width="190" height="48" rx="10" class="chip"/>
      <circle cx="72" cy="235" r="5" fill="#ffad45" filter="url(#glow)"/>
      <text x="90" y="241" class="chiptext">AWS</text>
    </g>
    <g class="float2">
      <rect x="257" y="211" width="190" height="48" rx="10" class="chip"/>
      <circle cx="277" cy="235" r="5" fill="#38a5ff" filter="url(#glow)"/>
      <text x="295" y="241" class="chiptext">AZURE</text>
    </g>
    <g class="float3">
      <rect x="462" y="211" width="190" height="48" rx="10" class="chip"/>
      <circle cx="482" cy="235" r="5" fill="#f5f7ff" filter="url(#glow)"/>
      <text x="500" y="241" class="chiptext">LINUX</text>
    </g>
    <g class="float1">
      <rect x="667" y="211" width="266" height="48" rx="10" class="chip"/>
      <circle cx="687" cy="235" r="5" fill="#a78bfa" filter="url(#glow)"/>
      <text x="705" y="241" class="chiptext">TERRAFORM</text>
    </g>
  </g>

  <!-- Section 2: Container and CI/CD -->
  <g>
    <path d="M42 328 L958 328 L974 344 L974 479 L958 495 L42 495 L26 479 L26 344 Z"
          fill="#030716" opacity=".75" transform="translate(0 8)"/>
    <path d="M42 328 L958 328 L974 344 L974 479 L958 495 L42 495 L26 479 L26 344 Z"
          fill="url(#glass)" stroke="#3c7fa9" stroke-width="1.5"/>
    <path d="M42 495 L958 495 L974 479 L974 492 L958 508 L42 508 L26 492 L26 479 Z"
          fill="url(#side)" opacity=".65"/>
    <text x="52" y="359" class="eyebrow">02 / AUTOMATION LAYER</text>
    <text x="52" y="391" class="heading">Container &amp; CI/CD</text>
    <text x="52" y="412" class="small">PACKAGE • INTEGRATE • DEPLOY</text>

    <g class="float2">
      <rect x="52" y="432" width="270" height="46" rx="10" class="chip"/>
      <circle cx="73" cy="455" r="5" fill="#32d6ff" filter="url(#glow)"/>
      <text x="91" y="461" class="chiptext">DOCKER</text>
    </g>
    <g class="float3">
      <rect x="339" y="432" width="294" height="46" rx="10" class="chip"/>
      <circle cx="360" cy="455" r="5" fill="#b6a2ff" filter="url(#glow)"/>
      <text x="378" y="461" class="chiptext">GITHUB ACTIONS</text>
    </g>
    <g class="float1">
      <rect x="650" y="432" width="283" height="46" rx="10" class="chip"/>
      <circle cx="671" cy="455" r="5" fill="#f3f7ff" filter="url(#glow)"/>
      <text x="689" y="461" class="chiptext">GIT / GITHUB</text>
    </g>
  </g>

  <!-- Section 3: Development -->
  <g>
    <path d="M42 543 L958 543 L974 559 L974 694 L958 710 L42 710 L26 694 L26 559 Z"
          fill="#030716" opacity=".75" transform="translate(0 8)"/>
    <path d="M42 543 L958 543 L974 559 L974 694 L958 710 L42 710 L26 694 L26 559 Z"
          fill="url(#glass)" stroke="#6657b8" stroke-width="1.5"/>
    <path d="M42 710 L958 710 L974 694 L974 707 L958 723 L42 723 L26 707 L26 694 Z"
          fill="url(#side)" opacity=".65"/>
    <text x="52" y="574" class="eyebrow">03 / APPLICATION LAYER</text>
    <text x="52" y="606" class="heading">Development</text>
    <text x="52" y="627" class="small">BUILD • CONNECT • CREATE</text>

    <g class="float1">
      <rect x="52" y="647" width="205" height="46" rx="10" class="chip"/>
      <circle cx="73" cy="670" r="5" fill="#f5d34f" filter="url(#glow)"/>
      <text x="91" y="676" class="chiptext">JAVASCRIPT</text>
    </g>
    <g class="float2">
      <rect x="273" y="647" width="205" height="46" rx="10" class="chip"/>
      <circle cx="294" cy="670" r="5" fill="#55e3a1" filter="url(#glow)"/>
      <text x="312" y="676" class="chiptext">NODE.JS</text>
    </g>
    <g class="float3">
      <rect x="494" y="647" width="205" height="46" rx="10" class="chip"/>
      <circle cx="515" cy="670" r="5" fill="#61dafb" filter="url(#glow)"/>
      <text x="533" y="676" class="chiptext">REACT</text>
    </g>
    <g class="float1">
      <rect x="715" y="647" width="218" height="46" rx="10" class="chip"/>
      <circle cx="736" cy="670" r="5" fill="#55e3a1" filter="url(#glow)"/>
      <text x="754" y="676" class="chiptext">MONGODB</text>
    </g>
  </g>

  <!-- Section 4: Roadmap -->
  <g>
    <path d="M42 758 L958 758 L974 774 L974 929 L958 945 L42 945 L26 929 L26 774 Z"
          fill="#030716" opacity=".75" transform="translate(0 8)"/>
    <path d="M42 758 L958 758 L974 774 L974 929 L958 945 L42 945 L26 929 L26 774 Z"
          fill="url(#glass)" stroke="#a35ce4" stroke-width="1.5"/>
    <path d="M42 945 L958 945 L974 929 L974 942 L958 958 L42 958 L26 942 L26 929 Z"
          fill="url(#side)" opacity=".7"/>
    <text x="52" y="789" class="eyebrow">04 / FUTURE SYSTEMS</text>
    <text x="52" y="821" class="heading">Next on My Roadmap</text>
    <text x="52" y="842" class="small">CURRENT LEARNING GOALS • SKILLS IN PROGRESS</text>

    <g class="float3">
      <rect x="52" y="866" width="270" height="50" rx="10" class="chip"/>
      <circle cx="74" cy="891" r="5" fill="#8b9dff" filter="url(#glow)"/>
      <text x="92" y="897" class="chiptext">KUBERNETES</text>
    </g>
    <g class="float1">
      <rect x="339" y="866" width="270" height="50" rx="10" class="chip"/>
      <circle cx="361" cy="891" r="5" fill="#e6a5ff" filter="url(#glow)"/>
      <text x="379" y="897" class="chiptext">ANSIBLE</text>
    </g>
    <g class="float2">
      <rect x="626" y="866" width="307" height="50" rx="10" class="chip"/>
      <circle cx="648" cy="891" r="5" fill="#55e3a1" filter="url(#glow)"/>
      <text x="666" y="897" class="chiptext">MONITORING</text>
    </g>
  </g>

  <!-- Footer -->
  <path d="M48 989H952" stroke="url(#cyanPurple)" stroke-opacity=".6"/>
  <text x="50" y="1019" class="small">BUILD</text>
  <text x="111" y="1019" font-family="Arial,sans-serif" font-size="16" fill="#00eaff">/</text>
  <text x="130" y="1019" class="small">AUTOMATE</text>
  <text x="222" y="1019" font-family="Arial,sans-serif" font-size="16" fill="#a78bfa">/</text>
  <text x="241" y="1019" class="small">DEPLOY</text>
  <text x="950" y="1019" text-anchor="end" class="small">ALWAYS LEARNING // ALWAYS BUILDING</text>

  <!-- Subtle animated scan line -->
  <rect x="26" y="100" width="948" height="2" fill="#00eaff" opacity=".14">
    <animate attributeName="y" values="100;970;100" dur="12s" repeatCount="indefinite"/>
  </rect>
</svg>