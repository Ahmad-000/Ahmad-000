<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset=".55" stop-color="#11152c"/>
      <stop offset="1" stop-color="#090b1b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b304b"/>
      <stop offset="1" stop-color="#15132c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00eaff"/>
      <stop offset=".5" stop-color="#7185ff"/>
      <stop offset="1" stop-color="#d66bff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7791ba" stroke-opacity=".1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .heading{font:700 23px Arial,sans-serif;fill:#f4f7ff}
      .label{font:11px Arial,sans-serif;fill:#80eaff;letter-spacing:3px}
      .name{font:700 16px Arial,sans-serif;fill:#f4f7ff}
      .detail{font:12px Arial,sans-serif;fill:#a9bbd9}
      .small{font:10px Arial,sans-serif;fill:#8299bd;letter-spacing:1.5px}
      .float1{animation:float 4s ease-in-out infinite}
      .float2{animation:float 4.7s ease-in-out infinite .6s}
      .float3{animation:float 5s ease-in-out infinite 1.1s}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    </style>
  </defs>

  <rect width="1000" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="22" fill="url(#grid)"/>
  <circle cx="100" cy="220" r="140" fill="#00eaff" opacity=".06"/>
  <circle cx="900" cy="80" r="140" fill="#a855f7" opacity=".07"/>

  <text x="42" y="40" class="label">ESTABLISH CONNECTION</text>
  <text x="42" y="72" class="heading">Let's Build Something Great</text>
  <text x="958" y="42" text-anchor="end" class="small">OPEN TO OPPORTUNITIES</text>

  <!-- LinkedIn card -->
  <g class="float1">
    <path d="M51 100H318L332 114V225L318 239H51L37 225V114Z"
          fill="#030615" opacity=".75" transform="translate(0 5)"/>
    <path d="M51 100H318L332 114V225L318 239H51L37 225V114Z"
          fill="url(#glass)" stroke="#00dfff" stroke-opacity=".85" stroke-width="1.4"/>
    <circle cx="80" cy="137" r="20" fill="#0b3349" stroke="#00dfff" stroke-opacity=".8"/>
    <text x="80" y="144" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#8eefff">in</text>
    <text x="110" y="135" class="name">LINKEDIN</text>
    <text x="110" y="155" class="detail">Professional network</text>
    <rect x="57" y="184" width="254" height="34" rx="8" fill="#10263c" stroke="#00dfff" stroke-opacity=".4"/>
    <text x="184" y="205" text-anchor="middle" class="detail">Connect with me ↗</text>
  </g>

  <!-- GitHub card -->
  <g class="float2">
    <path d="M367 100H634L648 114V225L634 239H367L353 225V114Z"
          fill="#030615" opacity=".75" transform="translate(0 5)"/>
    <path d="M367 100H634L648 114V225L634 239H367L353 225V114Z"
          fill="url(#glass)" stroke="#8c80ff" stroke-opacity=".9" stroke-width="1.4"/>
    <circle cx="396" cy="137" r="20" fill="#272044" stroke="#9a8cff" stroke-opacity=".9"/>
    <text x="396" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#e7e2ff">&lt;/&gt;</text>
    <text x="426" y="135" class="name">GITHUB</text>
    <text x="426" y="155" class="detail">Projects &amp; code</text>
    <rect x="373" y="184" width="254" height="34" rx="8" fill="#211d40" stroke="#9a8cff" stroke-opacity=".45"/>
    <text x="500" y="205" text-anchor="middle" class="detail">Explore my projects ↗</text>
  </g>

  <!-- Email card -->
  <g class="float3">
    <path d="M683 100H950L964 114V225L950 239H683L669 225V114Z"
          fill="#030615" opacity=".75" transform="translate(0 5)"/>
    <path d="M683 100H950L964 114V225L950 239H683L669 225V114Z"
          fill="url(#glass)" stroke="#d66bff" stroke-opacity=".85" stroke-width="1.4"/>
    <circle cx="712" cy="137" r="20" fill="#382044" stroke="#d66bff" stroke-opacity=".9"/>
    <path d="M701 130H723V144H701Z M701 130L712 138L723 130"
          fill="none" stroke="#f2c9ff" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="742" y="135" class="name">EMAIL</text>
    <text x="742" y="155" class="detail">Direct contact</text>
    <rect x="689" y="184" width="254" height="34" rx="8" fill="#30203d" stroke="#d66bff" stroke-opacity=".45"/>
    <text x="816" y="205" text-anchor="middle" class="detail">Send me a message ↗</text>
  </g>

  <path d="M42 263H958" stroke="url(#neon)" stroke-opacity=".6"/>
  <text x="42" y="284" class="small">CLOUD • DEVOPS • AUTOMATION</text>
  <text x="958" y="284" text-anchor="end" class="small">LET'S CONNECT</text>
</svg>
